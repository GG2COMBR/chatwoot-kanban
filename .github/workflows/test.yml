name: CI - Integridade e Testes do Pacote

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-package:
    name: Validação Estática e Integridade
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v7

      - name: Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar suíte de validação estática
        run: |
          chmod +x ./scripts/test-package.sh
          ./scripts/test-package.sh
